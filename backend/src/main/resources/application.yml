spring:
  application:
    name: skillcert-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/skillcert}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
server:
  port: ${PORT:8080}
management:
  endpoints:
    web:
      exposure:
        include: health,info
app:
  cors-origin: ${CORS_ORIGIN:http://localhost:5173}
  certificate-verification-base-url: ${CERTIFICATE_VERIFICATION_BASE_URL:https://skillcert.vaionyxsolutions.online/verify/}
  razorpay-key-id: ${RAZORPAY_KEY_ID:}
  razorpay-key-secret: ${RAZORPAY_KEY_SECRET:}
  razorpay-webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}
  resend-api-key: ${RESEND_API_KEY:}
  certificate-from-email: ${CERTIFICATE_FROM_EMAIL:}
  r2-account-id: ${R2_ACCOUNT_ID:}
  r2-access-key-id: ${R2_ACCESS_KEY_ID:}
  r2-secret-access-key: ${R2_SECRET_ACCESS_KEY:}
  r2-bucket-name: ${R2_BUCKET_NAME:}
  r2-public-base-url: ${R2_PUBLIC_BASE_URL:}
