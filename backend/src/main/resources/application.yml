spring:
  application:
    name: skillcert-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/skillcert}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
server:
  port: ${PORT:8080}
management:
  endpoints:
    web:
      exposure:
        include: health,info
app:
  cors-origin: ${CORS_ORIGIN:http://localhost:5173}
  certificate-verification-base-url: ${CERTIFICATE_VERIFICATION_BASE_URL:https://skillcert.vaionyxsolutions.online/verify/}
  razorpay-key-id: ${RAZORPAY_KEY_ID:}
  razorpay-key-secret: ${RAZORPAY_KEY_SECRET:}
  razorpay-webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}
